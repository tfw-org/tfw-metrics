name: Build and publish metrics dashboard

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/build_dashboard.py'
      - '.github/workflows/publish-dashboard.yml'
      - 'README.md'
  workflow_dispatch:
  workflow_run:
    workflows: [Collect ClusterFuzzLite metrics]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dashboard source
        uses: actions/checkout@v4
      - name: Check out metrics data
        uses: actions/checkout@v4
        with:
          ref: metrics-data
          path: metrics-data
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build static dashboard
        run: python .github/scripts/build_dashboard.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
